version: '3.8'
services:
  pgsql:
    image: postgres:15
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: "${DB_DATABASE}"
      POSTGRES_USER: "${DB_USERNAME}"
      POSTGRES_PASSWORD: "${DB_PASSWORD}"

  fuseki:
    image: stain/jena-fuseki
    ports:
      - "3030:3030"
    environment:
      ADMIN_PASSWORD: "${FUSEKI_ADMIN_PASSWORD:-admin}"
      FUSEKI_DATASET_1: airports
    volumes:
      - fuseki_data:/fuseki
      - ./semantic-data:/staging

volumes:
  fuseki_data:
